services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hatm
      POSTGRES_USER: hatm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatm"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    volumes:
      - ./backend/app:/code/app
      - ./secrets:/secrets:ro
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    command: celery -A app.celery_app worker -l info -Q default --concurrency=2
    env_file: .env
    volumes:
      - ./backend/app:/code/app
      - ./secrets:/secrets:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5

  beat:
    build: ./backend
    command: celery -A app.celery_app beat -l info
    env_file: .env
    volumes:
      - ./backend/app:/code/app
    depends_on:
      redis: {condition: service_healthy}

  ai:
    build: ./ai
    env_file: .env
    ports: ["8100:8100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    ports: ["3000:80"]
    depends_on: [api]

volumes:
  pgdata:
