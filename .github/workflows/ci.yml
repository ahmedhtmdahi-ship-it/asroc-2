name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # قيم بيئة الاختبار (مش أسرار حقيقية) — بتخلّي env.ts يعدّي والـ API يقلع.
      NODE_ENV: test
      DATABASE_URL: "file:./test.db"
      JWT_SECRET: ci-test-secret-1234567890

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @asroc/api exec prisma generate

      - name: Typecheck API
        run: pnpm --filter @asroc/api run typecheck

      - name: Typecheck web
        run: pnpm run typecheck

      - name: Build web
        run: pnpm run build
        env:
          VITE_API_URL: /api

      - name: Apply migrations (test DB)
        run: pnpm --filter @asroc/api exec prisma migrate deploy

      - name: API integration tests
        run: pnpm --filter @asroc/api run test
