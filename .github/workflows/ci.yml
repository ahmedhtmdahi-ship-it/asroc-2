name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # قيم بيئة الاختبار (مش أسرار حقيقية) — بتخلّي env.ts يعدّي والـ API يقلع.
      NODE_ENV: test
      DATABASE_URL: "file:./test.db"
      JWT_SECRET: ci-test-secret-1234567890

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @asroc/api exec prisma generate

      - name: Typecheck API
        run: pnpm --filter @asroc/api run typecheck

      - name: Typecheck web
        run: pnpm run typecheck

      - name: Build web
        run: pnpm run build
        env:
          VITE_API_URL: /api

      - name: Apply migrations (test DB)
        run: pnpm --filter @asroc/api exec prisma migrate deploy

      # حارس ضد schema/migration drift: بيطبّق الـ migrations على shadow DB مؤقتة
      # ويقارنها بـ schema.prisma. لو الـ schema سبق الـ migrations (زي ما حصل مع أعمدة
      # الـ audit اللي كانت شغالة بـ db push بس) الـ diff بيرجّع exit code 2 فالـ build
      # بيفشل بدل ما الـ drift يوصل production ويرمي P2022 وقت التشغيل.
      - name: Guard against schema/migration drift
        working-directory: api
        run: >
          pnpm exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "file:./drift-shadow.db"
          --exit-code

      - name: API integration tests
        run: pnpm --filter @asroc/api run test

  # اختبارات e2e الأساسية عبر المتصفح (المسار الكامل + الإنشاء + الموافقة). بتقلع
  # api+web وبتشغّل حزم 04/05/16 اللي بتأكّد أثرًا حقيقيًا (مش vacuous).
  e2e:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: "file:./test.db"
      JWT_SECRET: ci-test-secret-1234567890

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @asroc/api exec prisma generate

      - name: Apply migrations (test DB)
        run: pnpm --filter @asroc/api exec prisma migrate deploy

      # بنزرع حسابات الاختبار فقط (سريع) بدل الـ 1585 مستخدم الصناعي — الـ e2e
      # بيحتاج test-users + الأدوية + الأقسام بس. الأدوية والأقسام بتتزرع دايمًا.
      - name: Seed test DB (test accounts + medicines + departments)
        run: pnpm --filter @asroc/api exec prisma db seed
        env:
          SEED_USERS_FILE: ${{ github.workspace }}/api/prisma/seed-data/test-users.json

      - name: Install Playwright browser (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run core e2e (04 create, 05 approve, 16 checkup, 17 monthly)
        run: >
          pnpm exec playwright test
          e2e/04-employee-requests.spec.ts
          e2e/05-manager-approvals.spec.ts
          e2e/16-full-workflow.spec.ts
          e2e/17-monthly-workflow.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
