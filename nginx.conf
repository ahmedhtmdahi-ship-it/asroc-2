server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ترويسات أمان أساسية (تطبّق على كل الردود، الواجهة والـ API-proxy).
    # CSP مضبوط للـ SPA: سكربتات same-origin فقط، وستايل inline مسموح (Tailwind/Radix)،
    # الاتصال same-origin (الـ API خلف /api)، ومنع تضمين الصفحة في iframe (clickjacking).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # بروكسي للـ API — نفس الأصل (same-origin) فمفيش CORS ولا IP متبيّت في البناء.
    # /api/auth/login  →  http://api:4000/auth/login
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — أي مسار غير موجود يرجّع index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
