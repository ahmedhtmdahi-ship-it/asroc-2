# تشغيل كامل بأمر واحد: docker compose up -d
# بيشتغل بنفس الطريقة على Windows أو Linux — مناسب لسيرفر الشركة.
services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:/app/prisma/prod.db"
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      HOST: 0.0.0.0
    ports:
      - "4000:4000"
    volumes:
      - sqlite_data:/app/prisma

volumes:
  sqlite_data:
