# تشغيل كامل بأمر واحد: docker compose up -d
# بيشتغل بنفس الطريقة على Windows أو Linux — مناسب لسيرفر الشركة.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: asroc
      POSTGRES_PASSWORD: asroc_dev_password
      POSTGRES_DB: asroc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asroc"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://asroc:asroc_dev_password@db:5432/asroc
      JWT_SECRET: change-me-in-production-min-16-chars
      PORT: 4000
      HOST: 0.0.0.0
    ports:
      - "4000:4000"

volumes:
  pgdata:
